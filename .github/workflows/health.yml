name: 차트런 살아있나

on:
  schedule:
    # 10분마다. GitHub 사정으로 몇 분 늦게 돌 수 있다 — 감시 용도로는 충분하다.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "확인할 주소 (시험용 덮어쓰기 — 실패 메일이 오는지 볼 때 쓴다)"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 헬스체크 (DB 포함)
        run: |
          URL="${{ github.event.inputs.url || 'https://cgame.tokenpost.kr/api/health' }}"
          # 세 번 재시도 — 순간 끊김으로 헛알림이 오면 알림 자체를 안 믿게 된다
          for i in 1 2 3; do
            if curl -sf --max-time 20 "$URL" -o /tmp/health.json; then
              echo "정상: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "시도 $i 실패 — 20초 뒤 다시"
            sleep 20
          done
          echo "::error::차트런 헬스체크 실패 — $URL 이 세 번 연속 안 열린다. DB 제한(402)·정지·배포 사고 순으로 의심할 것."
          exit 1

      - name: 홈 화면
        if: ${{ !github.event.inputs.url }}
        run: |
          for i in 1 2 3; do
            curl -sf -o /dev/null --max-time 20 "https://cgame.tokenpost.kr/" && exit 0
            echo "시도 $i 실패 — 20초 뒤 다시"
            sleep 20
          done
          echo "::error::홈이 안 열린다 — Vercel 배포 상태를 볼 것"
          exit 1
